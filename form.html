<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Опрос</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
      background: #1a2a4a;
      color: #1a1a1a;
    }

    .form-card {
      width: 100%;
      max-width: 420px;
      padding: 28px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }

    h1 {
      margin: 0 0 24px;
      font-size: 1.5rem;
      font-weight: 600;
      text-align: center;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.9rem;
      font-weight: 500;
    }

    input[type="text"],
    input[type="email"],
    textarea {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      font-family: inherit;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    .checkbox-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 18px;
    }

    .checkbox-row input {
      margin-top: 3px;
    }

    .checkbox-row label {
      margin: 0;
      font-weight: 400;
      cursor: pointer;
    }

    button {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      background: #3b82f6;
      color: #fff;
      transition: background 0.15s;
    }

    button:hover {
      background: #2563eb;
    }

    #status {
      min-height: 44px;
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      line-height: 1.4;
      text-align: center;
    }

    #status.error {
      color: #dc2626;
      background: #fef2f2;
      border: 1px solid #fecaca;
    }

    #status.success {
      color: #15803d;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
    }
  </style>
</head>
<body>
  <div class="form-card">
    <h1>Опрос</h1>

    <form id="form" novalidate>
      <label for="name">Имя</label>
      <input type="text" id="name" name="name" autocomplete="name">

      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="email">

      <label for="message">Сообщение — какая ваша любимая марка машины?</label>
      <textarea id="message" name="message"></textarea>

      <div class="checkbox-row">
        <input type="checkbox" id="consent" name="consent">
        <label for="consent">Согласен на обработку данных</label>
      </div>

      <button type="submit">Отправить</button>
    </form>

    <div id="status"></div>
  </div>

  <script>
    const form = document.getElementById('form');
    const nameInput = document.getElementById('name');
    const emailInput = document.getElementById('email');
    const messageInput = document.getElementById('message');
    const consentInput = document.getElementById('consent');
    const status = document.getElementById('status');

    function showStatus(text, type) {
      status.textContent = text;
      status.className = type || '';
    }

    function isValidEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    form.addEventListener('submit', function (event) {
      event.preventDefault();

      const name = nameInput.value.trim();
      const email = emailInput.value.trim();
      const message = messageInput.value.trim();

      if (name === '' || email === '' || message === '') {
        showStatus('Заполните все поля', 'error');
        return;
      }

      if (!isValidEmail(email)) {
        showStatus('Введите корректный email', 'error');
        return;
      }

      if (!consentInput.checked) {
        showStatus('Нужно согласие на обработку данных', 'error');
        return;
      }

      showStatus('Форма отправлена', 'success');
      form.reset();
    });
  </script>
</body>
</html>
